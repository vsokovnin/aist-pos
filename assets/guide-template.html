<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инструкция</title>
<style>
:root{
  --background:#FAFAFA; --card:#FFFFFF; --secondary:#F5F5F7;
  --foreground:#111111; --muted-foreground:#595959; --subtle:#8A8A8E;
  --border:#E0E0E0;
  --primary:#0048B2; --primary-deep:#003484; --primary-soft:rgba(0,72,178,.07);
  --success-deep:#0f7a37; --success-soft:rgba(22,163,74,.10);
  --warn:#8a5a00; --warn-soft:rgba(234,179,8,.13);
  --font-display:"Commissioner",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --radius-sm:8px; --radius-md:10px; --radius-lg:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);
  font:17px/1.62 var(--font-body);letter-spacing:-.003em}
.wrap{max-width:760px;margin:0 auto;padding:40px 24px 90px}
h1{font-family:var(--font-display);font-size:32px;line-height:1.2;font-weight:600;margin:8px 0 14px}
h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin:38px 0 14px}
.kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--primary)}
.why{font-size:18px;color:var(--muted-foreground);margin:0 0 8px}
.before{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px 22px;margin-top:26px}
.before h2{margin:0 0 10px;font-size:17px}
.before ul{margin:0;padding-left:20px}
.before li{margin:6px 0;color:var(--muted-foreground)}
.step{display:flex;gap:18px;padding:24px 0;border-top:1px solid var(--border)}
.step:first-of-type{border-top:none}
.num{width:38px;height:38px;flex:none;border-radius:50%;background:var(--primary);color:#fff;
  font-family:var(--font-display);font-size:18px;font-weight:600;display:grid;place-items:center}
.body{flex:1;min-width:0}
.do{font-size:19px;font-weight:500;margin:4px 0 12px}
.line{display:flex;gap:12px;margin:8px 0;align-items:flex-start}
.tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--subtle);width:132px;flex:none;padding-top:4px}
.line p{margin:0;color:var(--muted-foreground);font-size:16px}
.line.fix .tag{color:var(--warn)}
.line.fix p{background:var(--warn-soft);border-radius:var(--radius-sm);padding:9px 13px;color:var(--foreground)}
.ask{background:var(--secondary);border-radius:var(--radius-md);padding:16px 18px;margin:18px 0 0;
  font-size:16px;line-height:1.55}
.copy{margin-top:12px;font:inherit;font-size:15px;padding:10px 16px;border:1px solid var(--primary);
  border-radius:var(--radius-sm);background:var(--primary);color:#fff;cursor:pointer}
.copy.done{background:var(--card);color:var(--primary-deep)}
.check{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:8px 22px}
.check label{display:flex;gap:12px;align-items:flex-start;padding:13px 0;
  border-top:1px solid var(--border);cursor:pointer}
.check label:first-child{border-top:none}
.check input{margin:5px 0 0;width:18px;height:18px;flex:none;accent-color:var(--primary)}
.check label.on span{color:var(--success-deep)}
.dont li{margin:10px 0;color:var(--muted-foreground)}
.next{margin-top:34px;padding:18px 22px;background:var(--primary-soft);border-radius:var(--radius-lg);
  color:var(--primary-deep)}
footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--border);
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--foreground);color:#fff;padding:11px 20px;border-radius:var(--radius-sm);
  font-size:14px;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%)}
@media print{.copy,.toast{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p class="why" id="why"></p>

  <div class="before">
    <h2>Что понадобится</h2>
    <ul id="before"></ul>
  </div>

  <h2>Как это сделать</h2>
  <div id="steps"></div>

  <h2>Как проверить, что получилось</h2>
  <div class="check" id="check"></div>

  <h2>Чего не делать</h2>
  <ul class="dont" id="dont"></ul>

  <div class="next" id="next"></div>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* GUIDE */
const GUIDE = {};
/* конец GUIDE */

const SKILL_VERSION = "dev";   /* подставляется сборщиком */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LSKEY = "pos-guide-" + GUIDE.cap + "-" + GUIDE.transition;
let store = {};
try { store = JSON.parse(localStorage.getItem(LSKEY) || "{}"); } catch(e) { store = {}; }

$("#kicker").textContent = GUIDE.kicker;
$("#title").textContent = GUIDE.title;
$("#why").textContent = GUIDE.why;
$("#before").innerHTML = GUIDE.before.map(b => "<li>" + esc(b) + "</li>").join("");

$("#steps").innerHTML = GUIDE.steps.map((s, i) =>
  '<div class="step"><div class="num">' + (i + 1) + '</div><div class="body">' +
  '<p class="do">' + esc(s.do) + "</p>" +
  '<div class="line"><span class="tag">Что вы увидите</span><p>' + esc(s.see) + "</p></div>" +
  '<div class="line fix"><span class="tag">Если не так</span><p>' + esc(s.fix) + "</p></div>" +
  (i === 1 && GUIDE.ask
    ? '<div class="ask">' + esc(GUIDE.ask) + "</div>" +
      '<button class="copy" data-copy="' + esc(GUIDE.ask) + '">Скопировать этот запрос</button>'
    : "") +
  "</div></div>").join("");

$("#check").innerHTML = GUIDE.check.map((c, i) => {
  const on = !!store["c" + i];
  return '<label class="' + (on ? "on" : "") + '"><input type="checkbox" data-i="' + i + '"' +
    (on ? " checked" : "") + "><span>" + esc(c) + "</span></label>";
}).join("");

$("#dont").innerHTML = GUIDE.pitfalls.map(p => "<li>" + esc(p) + "</li>").join("");
$("#next").textContent = GUIDE.next;
$("#foot").textContent = "AIST POS · навык " + SKILL_VERSION + " · инструкция к шагу";

function toast(m){
  const t = $("#toast"); t.textContent = m; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  navigator.clipboard.writeText(b.dataset.copy)
    .then(() => { b.classList.add("done"); b.textContent = "Скопировано — вставьте агенту"; })
    .catch(() => toast("Скопировать не вышло — выделите текст запроса вручную"));
});

document.addEventListener("change", e => {
  const t = e.target;
  if (!t.matches("input[data-i]")) return;
  store["c" + t.dataset.i] = t.checked;
  localStorage.setItem(LSKEY, JSON.stringify(store));
  t.closest("label").classList.toggle("on", t.checked);
});
</script>
</body>
</html>
