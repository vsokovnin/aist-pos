<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личная операционная система руководителя</title>
<style>
:root{
  --background:#FAFAFA; --card:#FFFFFF; --secondary:#F5F5F7;
  --foreground:#111111; --muted-foreground:#595959; --subtle:#8A8A8E;
  --border:#E0E0E0;
  --primary:#0048B2; --primary-deep:#003484; --primary-soft:rgba(0,72,178,.07);
  --success-deep:#0f7a37;
  --font-display:"Commissioner",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --radius-sm:8px; --radius-md:10px; --radius-lg:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);
  font:17px/1.62 var(--font-body);letter-spacing:-.003em}
.wrap{max-width:820px;margin:0 auto;padding:52px 24px 100px}
.kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
h1{font-family:var(--font-display);font-size:38px;line-height:1.15;font-weight:600;margin:10px 0 16px}
.lead{font-size:19px;color:var(--muted-foreground);margin:0}
h2{font-family:var(--font-display);font-size:23px;font-weight:600;margin:52px 0 16px}
p{margin:0 0 14px}
.pains{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:6px 24px}
.pains div{padding:14px 0;border-top:1px solid var(--border);color:var(--muted-foreground)}
.pains div:first-child{border-top:none}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px}
.card h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 8px}
.card p{font-size:15.5px;color:var(--muted-foreground);margin:0}
.layer{display:flex;gap:18px;padding:18px 0;border-top:1px solid var(--border)}
.layer:first-child{border-top:none}
.layer b{font-family:var(--font-display);font-size:17px;width:150px;flex:none}
.layer p{margin:0;color:var(--muted-foreground);font-size:16px}
.story{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px 22px;margin-bottom:12px}
.who{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle)}
.want{font-family:var(--font-display);font-size:18px;font-weight:600;margin:6px 0 8px}
.then{color:var(--muted-foreground);font-size:16px;margin:0}
ul{margin:0;padding-left:22px}
li{margin:9px 0;color:var(--muted-foreground)}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.privacy{background:var(--primary-soft);border-radius:var(--radius-lg);padding:20px 24px;color:var(--primary-deep)}
.start{border:1px solid var(--primary);border-radius:var(--radius-lg);padding:22px 24px;background:var(--card)}
.start h2{margin:0 0 8px}
.start p{margin:0;font-size:18px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--border);
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle)}
@media(max-width:760px){.cards,.two{grid-template-columns:1fr}.layer{display:block}.layer b{display:block;margin-bottom:6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">AIST POS · с чего всё начинается</div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>

  <h2 id="goalTitle"></h2>
  <p id="goalText"></p>
  <div class="pains" id="pains"></div>

  <h2 id="tasksTitle"></h2>
  <div class="cards" id="tasks"></div>

  <h2 id="howTitle"></h2>
  <p id="howText"></p>
  <div id="layers"></div>

  <h2 id="storiesTitle"></h2>
  <div id="stories"></div>

  <div class="two">
    <div>
      <h2 id="effectTitle"></h2>
      <ul id="effect"></ul>
    </div>
    <div>
      <h2 id="notTitle"></h2>
      <ul id="not"></ul>
    </div>
  </div>

  <h2 id="needTitle"></h2>
  <ul id="need"></ul>

  <h2 id="privacyTitle"></h2>
  <div class="privacy" id="privacyText"></div>

  <div class="start" style="margin-top:52px">
    <h2 id="startTitle" style="margin-top:0"></h2>
    <p id="startText"></p>
  </div>

  <footer id="foot"></footer>
</div>

<script>
/* PLAYBOOK */
const PB = {};
/* конец PLAYBOOK */

const SKILL_VERSION = "dev";   /* подставляется сборщиком */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#title").textContent = PB.title;
$("#lead").textContent = PB.lead;
$("#goalTitle").textContent = PB.goal.title;
$("#goalText").textContent = PB.goal.text;
$("#pains").innerHTML = PB.pains.map(p => "<div>" + esc(p) + "</div>").join("");

$("#tasksTitle").textContent = PB.tasks.title;
$("#tasks").innerHTML = PB.tasks.items.map(t =>
  '<div class="card"><h3>' + esc(t.title) + "</h3><p>" + esc(t.text) + "</p></div>").join("");

$("#howTitle").textContent = PB.how.title;
$("#howText").textContent = PB.how.text;
$("#layers").innerHTML = PB.how.layers.map(l =>
  '<div class="layer"><b>' + esc(l.n) + "</b><p>" + esc(l.text) + "</p></div>").join("");

$("#storiesTitle").textContent = PB.stories.title;
$("#stories").innerHTML = PB.stories.items.map(s =>
  '<div class="story"><div class="who">' + esc(s.who) + '</div>' +
  '<div class="want">' + esc(s.want) + "</div>" +
  '<p class="then">' + esc(s.then) + "</p></div>").join("");

$("#effectTitle").textContent = PB.effect.title;
$("#effect").innerHTML = PB.effect.items.map(i => "<li>" + esc(i) + "</li>").join("");
$("#notTitle").textContent = PB.not.title;
$("#not").innerHTML = PB.not.items.map(i => "<li>" + esc(i) + "</li>").join("");
$("#needTitle").textContent = PB.need.title;
$("#need").innerHTML = PB.need.items.map(i => "<li>" + esc(i) + "</li>").join("");

$("#privacyTitle").textContent = PB.privacy.title;
$("#privacyText").textContent = PB.privacy.text;
$("#startTitle").textContent = PB.start.title;
$("#startText").textContent = PB.start.text;
$("#foot").textContent = "AIST POS · навык " + SKILL_VERSION + " · плейбук";
</script>
</body>
</html>
