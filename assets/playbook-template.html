<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личная операционная система руководителя</title>
<style>
:root{
  --background:#FAFAFA; --card:#FFFFFF; --secondary:#F5F5F7;
  --foreground:#111111; --muted-foreground:#595959; --subtle:#8A8A8E;
  --border:#E0E0E0;
  --primary:#0048B2; --primary-deep:#003484; --primary-soft:rgba(0,72,178,.07);
  --success-deep:#0f7a37;
  --font-display:"Commissioner",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --radius-sm:8px; --radius-md:10px; --radius-lg:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);
  font:17px/1.62 var(--font-body);letter-spacing:-.003em}
.wrap{max-width:1040px;margin:0 auto;padding:52px 24px 100px}
.after,.sub,.afoot,#mapTitle{max-width:820px}
.kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.kicker.mute{color:var(--subtle)}
.addr{display:flex;justify-content:space-between;align-items:baseline;gap:20px;
  border-bottom:1px solid var(--border);padding-bottom:12px}
h1{font-family:var(--font-display);font-size:34px;line-height:1.16;font-weight:600;margin:14px 0 0;max-width:800px}
.arow{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;border-top:1px solid var(--border)}
.acell{padding:18px 24px 0;border-right:1px solid var(--border)}
.acell:first-child{padding-left:0}
.acell:last-child{border-right:none}
.acell .clabel{margin-bottom:8px}
.acell p{margin:0;font-size:15.5px;line-height:1.5;color:var(--muted-foreground)}
h2{font-family:var(--font-display);font-size:23px;font-weight:600;margin:52px 0 16px}
p{margin:0 0 14px}
.zig{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-top:40px}
.zig.grey{background:var(--secondary);border-radius:var(--radius-lg);padding:30px 32px;gap:34px}
.zig.rev .ztext{order:2}
.kick{font-family:var(--font-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--subtle);margin-bottom:10px}
.kick.blue{color:var(--primary)}
.ztext h2{font-family:var(--font-display);font-size:30px;line-height:1.16;font-weight:600;margin:0 0 14px}
.ztext p{margin:0 0 12px;color:var(--muted-foreground);font-size:17px}
.ztiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-self:start}
.zt{background:var(--secondary);border-radius:var(--radius-md);padding:15px 17px}
.zt b{font-family:var(--font-display);font-size:15.5px;display:block;margin-bottom:5px;line-height:1.3}
.zt span{color:var(--subtle);font-size:13.5px;line-height:1.45;display:block}
.clabel{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--subtle);margin-bottom:10px}
.clabel.blue{color:var(--primary)}
.digest{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--card)}
.dhead{background:var(--primary);color:#fff;font-family:var(--font-display);font-weight:600;padding:14px 20px}
.drow{display:flex;gap:18px;padding:16px 22px;border-top:1px solid var(--border)}
.drow:first-child{border-top:none}
.dt{font-family:var(--font-mono);font-size:12.5px;color:var(--primary-deep);width:104px;flex:none;padding-top:2px}
.drow b{font-family:var(--font-display);font-size:16px}
.drow p{margin:4px 0 0;color:var(--muted-foreground);font-size:14.5px}
.dfoot{padding:12px 20px;background:var(--secondary);font-size:13px;color:var(--subtle)}
.after{margin:6px 0 0;color:var(--subtle);font-size:15.5px}
.sub{font-size:16px;color:var(--muted-foreground);margin:-6px 0 24px}
.abox{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:start}
.ajob{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px}
.ajob b{display:block;font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.25;margin:8px 0}
.ajob p{margin:0;font-size:14.5px;color:var(--muted-foreground);line-height:1.5}
.acaps{border-top:1px solid var(--border)}
.acap{display:flex;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid var(--border)}
.acap .nm{flex:1;font-size:16px}
.acap .lv{width:210px;flex:none;font-size:13.5px;color:var(--subtle)}
.acap.hi .lv{color:var(--primary)}
.dots{display:flex;gap:5px;align-items:center;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--border)}
.dots i.on{background:var(--primary)}
.dots i.base{box-shadow:0 0 0 2px var(--background),0 0 0 3.5px #B9CCE8}
.anote{margin:14px 0 0;font-size:15px;color:var(--muted-foreground)}
.afoot{margin:24px 0 0;padding-top:14px;border-top:1px solid var(--border);
  font-size:14.5px;color:var(--subtle)}
.jhint{display:flex;justify-content:space-between;margin:0 0 12px}
.jhint span{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--subtle)}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 0 14px}
.jc{flex:0 0 360px;scroll-snap-align:start;background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:22px 22px 24px}
.jbig{color:var(--primary);margin-bottom:18px}
.jbig svg{width:44px;height:44px;stroke-width:1.3}
.jc b{display:block;font-family:var(--font-display);font-size:18.5px;font-weight:600;line-height:1.28}
.jc p{margin:6px 0 0;font-size:14.5px;color:var(--muted-foreground);line-height:1.5}
ul{margin:0;padding-left:22px}
li{margin:9px 0;color:var(--muted-foreground)}
.reg{border-top:1px solid var(--border)}
.rg{display:grid;grid-template-columns:210px 1fr;gap:26px;padding:18px 0;
  border-bottom:1px solid var(--border)}
.rg h3{font-family:var(--font-display);font-size:16.5px;font-weight:600;margin:0}
.rg ul{padding:0;list-style:none}
.rg li{margin:0 0 10px;font-size:15.5px;line-height:1.55}
.rg li:last-child{margin-bottom:0}
.rg p{margin:0;font-size:15.5px;color:var(--muted-foreground);line-height:1.55}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:4px}
.tlc{padding-right:22px;display:flex;flex-direction:column}
.tlc h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 12px}
.axis{display:flex;align-items:center;height:22px;margin:2px 0 14px}
.axis span{height:2px;background:#DCE5F3;flex:1}
.axis i{width:11px;height:11px;border-radius:50%;background:var(--primary);flex:none}
.tlc p{margin:0 0 10px;font-size:14.5px;color:var(--muted-foreground)}
.tlc p b{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--subtle);font-weight:400;margin-bottom:3px}
.tlc p.you b{color:var(--primary)}
.tlc .out{margin-top:auto;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:10px 12px;font-size:13.5px;color:var(--foreground)}
.talk{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);
  overflow:hidden;margin-top:52px}
.thead{padding:20px 26px 2px}
.thead h2{margin:0 0 4px;font-size:21px}
.thead span{font-size:15.5px;color:var(--muted-foreground)}
.line{display:flex;gap:16px;padding:16px 26px;border-top:1px solid #EFEFF2;align-items:flex-start}
.line .w{flex:none;width:74px;font-family:var(--font-mono);font-size:10.5px;line-height:1.6;
  letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);padding-top:3px}
.line.me .w{color:var(--primary)}
.line.me b{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--primary-deep)}
.line p{margin:0;font-size:15.5px;color:var(--muted-foreground)}
.tfoot{padding:15px 26px;background:var(--secondary);font-size:15.5px;color:var(--foreground)}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--border);
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle)}
@media(max-width:760px){.rg,.zig,.ztiles,.arow,.abox,.tl{grid-template-columns:1fr}.zig.rev .ztext{order:0}
  .jc{flex-basis:82%}.tlc{padding:0 0 22px}
  .acap{flex-wrap:wrap;gap:10px}.acap .nm{flex:1 0 100%}.acap .lv{width:auto}
  .addr{display:block}.addr .kicker.mute{display:block;margin-top:6px}
  h1{font-size:29px}.acell{padding:16px 0 0;border-right:none;border-top:1px solid var(--border)}.acell:first-child{border-top:none;padding-top:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="addr">
    <span class="kicker" id="headKicker"></span>
    <span class="kicker mute" id="headRead"></span>
  </div>
  <h1 id="title"></h1>
  <div class="arow" id="headCells"></div>

  <div class="zig">
    <div class="ztext">
      <div class="kick" id="problemKick"></div>
      <h2 id="problemTitle"></h2>
      <p id="problemText"></p>
    </div>
    <div class="ztiles" id="pains"></div>
  </div>

  <div class="zig rev grey">
    <div class="ztext">
      <div class="kick blue" id="visionKick"></div>
      <h2 id="visionTitle"></h2>
      <p id="visionText"></p>
      <p class="after" id="after"></p>
    </div>
    <div class="zart">
      <div class="clabel blue" id="digestLabel"></div>
      <div class="digest">
        <div class="dhead" id="digestTitle"></div>
        <div id="digestRows"></div>
        <div class="dfoot" id="digestFoot"></div>
      </div>
    </div>
  </div>

  <h2 id="mapTitle"></h2>
  <p class="sub" id="mapSub"></p>
  <div class="abox">
    <div class="ajob">
      <div class="clabel blue" id="mapJobLabel"></div>
      <b id="mapJobTitle"></b>
      <p id="mapJobText"></p>
    </div>
    <div>
      <div class="clabel" id="mapCapsLabel"></div>
      <div class="acaps" id="mapCaps"></div>
      <p class="anote" id="mapNote"></p>
    </div>
  </div>
  <p class="afoot" id="mapFoot"></p>

  <h2 id="jobsTitle"></h2>
  <p class="sub" id="jobsSub"></p>
  <div class="jhint"><span id="jobsHint"></span><span id="jobsCount"></span></div>
  <div class="strip" id="jobs"></div>
  <p class="afoot" id="jobsFoot"></p>

  <h2 id="routeTitle"></h2>
  <p class="sub" id="routeSub"></p>
  <div class="tl" id="route"></div>
  <p class="afoot" id="routeFoot"></p>

  <h2 id="limitsTitle"></h2>
  <p class="sub" id="limitsSub"></p>
  <div class="reg" id="limits"></div>

  <div class="talk">
    <div class="thead">
      <h2 id="startTitle" style="margin-top:0"></h2>
      <span id="startSub"></span>
    </div>
    <div class="line me"><span class="w">Вы</span><b id="startSay"></b></div>
    <div class="line"><span class="w">Агент</span><p id="startAgent"></p></div>
    <div class="tfoot" id="startFoot"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
/* PLAYBOOK */
const PB = {};
/* конец PLAYBOOK */

/* знаки задач в ленте: тоньше и крупнее, чем ICONS выше — рисунок под смысл задачи */
const JOBICONS = {
  digest:'<path d="M3 17h18M6 17a6 6 0 0 1 12 0M12 4v2M4.6 7.6l1.4 1.4M19.4 7.6L18 9M2 21h20"/>',
  people:'<circle cx="8.5" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.3"/><path d="M2.5 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 14c3 0 5.5 1.8 5.5 4.5"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/>',
  handout:'<rect x="2.5" y="5" width="19" height="13" rx="2"/><path d="M2.5 7l9.5 6.5L21.5 7"/>',
  board:'<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20.5h8M12 16.5v4M7 12l2.5-2.5L12 12l4-4"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><circle cx="10.5" cy="13" r="3"/><path d="M12.8 15.3L15 17.5"/>',
  quarter:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15.5l2 2 4-4.5"/>',
  chart:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/>',
  dossier:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="11" r="2.2"/><path d="M5 16.2c.6-1.4 2-2.2 3.5-2.2s2.9.8 3.5 2.2M15 10h4M15 13.5h4"/>',
  slides:'<rect x="5" y="3" width="16" height="12" rx="2"/><path d="M2 7v12a2 2 0 0 0 2 2h13"/><path d="M9 9h8M9 12h5"/>',
  pen:'<path d="M5 19h4l9.5-9.5a2 2 0 0 0-2.8-2.8L6 16v3z"/><path d="M14 7.5l2.5 2.5"/>',
  keys:'<circle cx="8" cy="9" r="3"/><path d="M3 19c.6-3 2.6-4.5 5-4.5s4.4 1.5 5 4.5"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17.5 12v6M16 15.5h3M16 18h3"/>',
  debate:'<path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h7a1.5 1.5 0 0 1 1.5 1.5v3A1.5 1.5 0 0 1 11 10H5.5l-3 2.5z"/><path d="M11.5 13.5A1.5 1.5 0 0 1 13 12h7a1.5 1.5 0 0 1 1.5 1.5v3A1.5 1.5 0 0 1 20 18h-1.5l-3 2.5V18H13a1.5 1.5 0 0 1-1.5-1.5z"/>',
};
const jobIcon = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-linecap="round" stroke-linejoin="round">' + (JOBICONS[k] || "") + "</svg>";

const SKILL_VERSION = "dev";   /* подставляется сборщиком */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#title").textContent = PB.title;
$("#headKicker").textContent = PB.head.kicker;
$("#headRead").textContent = PB.head.read;
$("#headCells").innerHTML = PB.head.cells.map(c =>
  '<div class="acell"><div class="clabel">' + esc(c.label) + "</div><p>" + esc(c.text) + "</p></div>").join("");
const H = PB.hero;
$("#problemKick").textContent = PB.problem.kicker;
$("#problemTitle").textContent = PB.problem.title;
$("#problemText").textContent = PB.problem.text;
$("#pains").innerHTML = PB.pains.map(p =>
  '<div class="zt"><b>' + esc(p.pain) + "</b><span>" + esc(p.cost) + "</span></div>").join("");
$("#visionKick").textContent = PB.vision.kicker;
$("#visionTitle").textContent = PB.vision.title;
$("#visionText").textContent = PB.vision.text;
$("#digestLabel").textContent = H.digestLabel;
$("#digestTitle").textContent = H.digestTitle;
$("#digestRows").innerHTML = H.digest.map(r =>
  '<div class="drow"><span class="dt">' + esc(r.when) + "</span><div><b>" + esc(r.who) +
  "</b><p>" + esc(r.what) + "</p></div></div>").join("");
$("#digestFoot").textContent = H.digestFoot;
$("#after").textContent = H.after;

const M = PB.map;
$("#mapTitle").textContent = M.title;
$("#mapSub").textContent = M.sub;
$("#mapJobLabel").textContent = M.job.label;
$("#mapJobTitle").textContent = M.job.title;
$("#mapJobText").textContent = M.job.text;
$("#mapCapsLabel").textContent = M.capsLabel;
$("#mapCaps").innerHTML = M.caps.map(c =>
  '<div class="acap' + (c.need > 3 ? " hi" : "") + '"><span class="nm">' + esc(c.name) + '</span><span class="dots">' +
  [1, 2, 3, 4, 5].map(n => '<i class="dot' + (n <= c.need ? " on" : "") + (n === 3 ? " base" : "") + '"></i>').join("") +
  '</span><span class="lv">' + esc(c.note) + "</span></div>").join("");
$("#mapNote").textContent = M.note;
$("#mapFoot").textContent = M.foot;

const R = PB.route;
$("#routeTitle").textContent = R.title;
$("#routeSub").textContent = R.sub;
$("#route").innerHTML = R.steps.map((s, i) =>
  '<div class="tlc"><div class="axis"><i></i>' + (i < R.steps.length - 1 ? "<span></span>" : "") +
  "</div><h3>" + esc(s.title) + '</h3><p><b>система</b>' + esc(s.sys) +
  '</p><p class="you"><b>вы</b>' + esc(s.you) + '</p><div class="out">' + esc(s.out) +
  "</div></div>").join("");
$("#routeFoot").textContent = R.foot;

$("#jobsTitle").textContent = PB.jobs.title;
$("#jobsSub").textContent = PB.jobs.sub;
$("#jobsHint").textContent = PB.jobs.hint;
$("#jobsCount").textContent = "1—" + PB.jobs.items.length;
$("#jobs").innerHTML = PB.jobs.items.map(j =>
  '<div class="jc"><div class="jbig">' + jobIcon(j.icon) + "</div><b>" + esc(j.title) +
  "</b><p>" + esc(j.short) + "</p></div>").join("");
$("#jobsFoot").textContent = PB.jobs.foot;

$("#limitsTitle").textContent = PB.limits.title;
$("#limitsSub").textContent = PB.limits.sub;
$("#limits").innerHTML = PB.limits.groups.map(g =>
  '<div class="rg"><h3>' + esc(g.title) + "</h3>" +
  (g.items ? "<ul>" + g.items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul>"
           : "<p>" + esc(g.text) + "</p>") + "</div>").join("");
$("#startTitle").textContent = PB.start.title;
$("#startSub").textContent = PB.start.sub;
$("#startSay").textContent = "«" + PB.start.say + "»";
$("#startAgent").textContent = PB.start.agent;
$("#startFoot").textContent = PB.start.foot;
$("#foot").textContent = "AIST POS · навык " + SKILL_VERSION + " · плейбук";
</script>
</body>
</html>
