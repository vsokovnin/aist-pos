<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личная операционная система руководителя</title>
<style>
:root{
  --background:#FAFAFA; --card:#FFFFFF; --secondary:#F5F5F7;
  --foreground:#111111; --muted-foreground:#595959; --subtle:#8A8A8E;
  --border:#E0E0E0;
  --primary:#0048B2; --primary-deep:#003484; --primary-soft:rgba(0,72,178,.07);
  --success-deep:#0f7a37;
  --font-display:"Commissioner",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --radius-sm:8px; --radius-md:10px; --radius-lg:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);
  font:17px/1.62 var(--font-body);letter-spacing:-.003em}
.wrap{max-width:1040px;margin:0 auto;padding:52px 24px 100px}
h1,.lead,#goalText,#howText,.layer p,#need,.privacy,.after{max-width:820px}
.kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
h1{font-family:var(--font-display);font-size:40px;line-height:1.15;font-weight:600;margin:10px 0 16px}
.lead{font-size:19px;color:var(--muted-foreground);margin:0}
h2{font-family:var(--font-display);font-size:23px;font-weight:600;margin:52px 0 16px}
p{margin:0 0 14px}
.scene{display:grid;grid-template-columns:1fr 1.05fr;gap:28px;margin-top:36px;align-items:start}
.clabel{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--subtle);margin-bottom:10px}
.clabel.blue{color:var(--primary)}
.chaosbox{background:var(--secondary);border-radius:var(--radius-lg);padding:22px 24px}
.chaosbox .big{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0 0 6px}
.chaosbox .q{font-size:17px;color:#8a5a00;margin:0 0 14px}
.chaosbox ul{margin:0 0 16px;padding-left:20px}
.chaosbox li{margin:8px 0;color:var(--muted-foreground);font-size:15.5px}
.chaosbox .cost{margin:0;color:var(--subtle);font-size:14.5px}
.digest{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--card)}
.dhead{background:var(--primary);color:#fff;font-family:var(--font-display);font-weight:600;padding:14px 20px}
.drow{display:flex;gap:18px;padding:16px 22px;border-top:1px solid var(--border)}
.drow:first-child{border-top:none}
.dt{font-family:var(--font-mono);font-size:12.5px;color:var(--primary-deep);width:104px;flex:none;padding-top:2px}
.drow b{font-family:var(--font-display);font-size:16px}
.drow p{margin:4px 0 0;color:var(--muted-foreground);font-size:14.5px}
.dfoot{padding:12px 20px;background:var(--secondary);font-size:13px;color:var(--subtle)}
.after{margin:22px 0 0;color:var(--muted-foreground);max-width:820px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px}
.card h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 8px}
.card p{font-size:15.5px;color:var(--muted-foreground);margin:0}
.layer{display:flex;gap:18px;padding:18px 0;border-top:1px solid var(--border)}
.layer:first-child{border-top:none}
.layer b{font-family:var(--font-display);font-size:17px;width:150px;flex:none}
.layer p{margin:0;color:var(--muted-foreground);font-size:16px}
.card{position:relative}
.ic{width:34px;height:34px;border-radius:9px;background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;flex:none;margin-bottom:12px}
.ic svg{width:19px;height:19px}
.story{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px}
.story.big{display:flex;gap:18px;align-items:flex-start;border-color:var(--primary);
  background:var(--primary-soft);margin-bottom:14px}
.story.big .ic{background:var(--card);margin-bottom:0}
.story.big .want{font-size:21px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.story.sm .want{font-size:17px}
.story.sm .then{font-size:15px}
.who{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle)}
.want{font-family:var(--font-display);font-size:18px;font-weight:600;margin:6px 0 8px}
.then{color:var(--muted-foreground);font-size:16px;margin:0}
ul{margin:0;padding-left:22px}
li{margin:9px 0;color:var(--muted-foreground)}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.privacy{background:var(--primary-soft);border-radius:var(--radius-lg);padding:20px 24px;color:var(--primary-deep)}
.start{border:1px solid var(--primary);border-radius:var(--radius-lg);padding:22px 24px;background:var(--card)}
.start h2{margin:0 0 8px}
.start p{margin:0;font-size:18px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--border);
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle)}
@media(max-width:760px){.cards,.two,.scene,.sgrid{grid-template-columns:1fr}.layer{display:block}.layer b{display:block;margin-bottom:6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">AIST POS · с чего всё начинается</div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>

  <div class="scene">
    <div>
      <div class="clabel" id="chaosLabel"></div>
      <div class="chaosbox">
        <p class="big" id="chaosTitle"></p>
        <p class="q" id="chaosQuestion"></p>
        <ul id="pains"></ul>
        <p class="cost" id="chaosCost"></p>
      </div>
    </div>
    <div>
      <div class="clabel blue" id="digestLabel"></div>
      <div class="digest">
        <div class="dhead" id="digestTitle"></div>
        <div id="digestRows"></div>
        <div class="dfoot" id="digestFoot"></div>
      </div>
    </div>
  </div>
  <p class="after" id="after"></p>

  <h2 id="goalTitle"></h2>
  <p id="goalText"></p>

  <h2 id="tasksTitle"></h2>
  <div class="cards" id="tasks"></div>

  <h2 id="howTitle"></h2>
  <p id="howText"></p>
  <div id="layers"></div>

  <h2 id="storiesTitle"></h2>
  <div id="stories"></div>

  <div class="two">
    <div>
      <h2 id="effectTitle"></h2>
      <ul id="effect"></ul>
    </div>
    <div>
      <h2 id="notTitle"></h2>
      <ul id="not"></ul>
    </div>
  </div>

  <h2 id="needTitle"></h2>
  <ul id="need"></ul>

  <h2 id="privacyTitle"></h2>
  <div class="privacy" id="privacyText"></div>

  <div class="start" style="margin-top:52px">
    <h2 id="startTitle" style="margin-top:0"></h2>
    <p id="startText"></p>
  </div>

  <footer id="foot"></footer>
</div>

<script>
/* PLAYBOOK */
const PB = {};
/* конец PLAYBOOK */

const ICONS = {
  chart:'<path d="M4 20V4"/><path d="M4 20h16"/><rect x="8" y="12" width="3" height="5"/><rect x="13" y="8" width="3" height="9"/><rect x="18" y="14" width="3" height="3"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.2l2.6 2.6 4.6-5"/>',
  handout:'<path d="M6 4h8l4 4v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M14 4v4h4"/><path d="M9 15h6M9 12h4"/>',
  quarter:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15.5l2 2 4-4.5"/>',
  people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M3.5 19c.6-3 3-4.6 5.5-4.6S14 16 14.6 19M15.5 19c.3-2 1.6-3.2 3.3-3.2 1.2 0 2.2.5 2.9 1.4"/>',
  board:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 12l2.5-2.5L12 12l4-4"/>',
  keys:'<circle cx="8" cy="9" r="3"/><path d="M3 19c.6-3 2.6-4.5 5-4.5s4.4 1.5 5 4.5"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17.5 12v6M16 15.5h3M16 18h3"/>',
  pen:'<path d="M5 19h4l9.5-9.5a2 2 0 0 0-2.8-2.8L6 16v3z"/><path d="M14 7.5l2.5 2.5"/>',
};
const icon = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[k] || "") + "</svg>";

const SKILL_VERSION = "dev";   /* подставляется сборщиком */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#title").textContent = PB.title;
$("#lead").textContent = PB.lead;
const H = PB.hero;
$("#chaosLabel").textContent = H.chaosLabel;
$("#chaosTitle").textContent = H.chaosTitle;
$("#chaosQuestion").textContent = H.chaosQuestion;
$("#chaosCost").textContent = H.chaosCost;
$("#pains").innerHTML = PB.pains.map(p => "<li>" + esc(p) + "</li>").join("");
$("#digestLabel").textContent = H.digestLabel;
$("#digestTitle").textContent = H.digestTitle;
$("#digestRows").innerHTML = H.digest.map(r =>
  '<div class="drow"><span class="dt">' + esc(r.when) + "</span><div><b>" + esc(r.who) +
  "</b><p>" + esc(r.what) + "</p></div></div>").join("");
$("#digestFoot").textContent = H.digestFoot;
$("#after").textContent = H.after;

$("#goalTitle").textContent = PB.goal.title;
$("#goalText").textContent = PB.goal.text;

$("#tasksTitle").textContent = PB.tasks.title;
$("#tasks").innerHTML = PB.tasks.items.map(t =>
  '<div class="card"><span class="ic">' + icon(t.icon) + "</span><h3>" + esc(t.title) +
  "</h3><p>" + esc(t.text) + "</p></div>").join("");

$("#howTitle").textContent = PB.how.title;
$("#howText").textContent = PB.how.text;
$("#layers").innerHTML = PB.how.layers.map(l =>
  '<div class="layer"><b>' + esc(l.n) + "</b><p>" + esc(l.text) + "</p></div>").join("");

$("#storiesTitle").textContent = PB.stories.title;
const st = PB.stories.items;
const storyBig = s =>
  '<div class="story big"><span class="ic">' + icon(s.icon) + "</span>" +
  '<div><div class="who">' + esc(s.who) + '</div><div class="want">' + esc(s.want) + "</div>" +
  '<p class="then">' + esc(s.then) + "</p></div></div>";
const storySm = s =>
  '<div class="story sm"><span class="ic">' + icon(s.icon) + "</span>" +
  '<div class="who">' + esc(s.who) + '</div><div class="want">' + esc(s.want) + "</div>" +
  '<p class="then">' + esc(s.then) + "</p></div>";
$("#stories").innerHTML = storyBig(st[0]) +
  '<div class="sgrid">' + st.slice(1).map(storySm).join("") + "</div>";

$("#effectTitle").textContent = PB.effect.title;
$("#effect").innerHTML = PB.effect.items.map(i => "<li>" + esc(i) + "</li>").join("");
$("#notTitle").textContent = PB.not.title;
$("#not").innerHTML = PB.not.items.map(i => "<li>" + esc(i) + "</li>").join("");
$("#needTitle").textContent = PB.need.title;
$("#need").innerHTML = PB.need.items.map(i => "<li>" + esc(i) + "</li>").join("");

$("#privacyTitle").textContent = PB.privacy.title;
$("#privacyText").textContent = PB.privacy.text;
$("#startTitle").textContent = PB.start.title;
$("#startText").textContent = PB.start.text;
$("#foot").textContent = "AIST POS · навык " + SKILL_VERSION + " · плейбук";
</script>
</body>
</html>
