# Рубрика AIST POS — 18 способностей в 5 направлениях.
# Шкала уровней 1-5 по каждой способности; формулировки уровней — в levels.
# профиль = per-cap уровни; в каждом кластере помечается слабое звено (самый низкий cap) — диагностический флаг, НЕ агрегат.
# headline-стадия (гибрид) = round(mean(cluster_avg)); слабое звено (min cluster_avg) показывается отдельно — см. stage-map.yaml.
meta:
  version: 0.4
  capabilities_count: 18   # проверяется сборкой; расходится с реальностью — сборка падает
  clusters_count: 5
  source_ssot: "docs/capability-model.md"
  scoring: "per-cap levels; weakest-link flagged; headline stage = round(mean(cluster_avg)); weak_link = argmin(cluster_avg)"

clusters:
  - id: context
    title: "Контекст — агент вас знает и помнит"
    caps: [memory, context_seed]
  - id: files
    title: "Файлы, структура, доступ"
    caps: [naming, root_file, git, source_map, handover]
  - id: capture
    title: "Входящие и связи"
    caps: [connectors, capture, graph]
  - id: work
    title: "Работа — как получается результат"
    caps: [doc_source, playbook, quality, output_form, autonomy]
  - id: knowledge
    title: "Знание и решения"
    caps: [research, decision_log, sign_off]

capabilities:
  - id: memory
    cluster: context
    title: "Память агента"
    inspect:
      - "файлы памяти (CLAUDE.md / memory.md / аналог), обновляемые между сессиями"
      - "разделение семантической (где что) и процедурной (как делать) памяти"
    ask: "Когда вы открываете новый чат — агент уже помнит ваши прошлые решения и привычки, или приходится каждый раз объяснять всё заново?"
    levels:
      L1: "Каждый новый чат начинаю с нуля — объясняю всё заново"
      L2: "Кое-что запоминает, но беспорядочно — нужное не всегда находит"
      L3: "Агент сам ведёт про меня заметки двух видов: что у меня есть и где лежит, и как я люблю, чтобы делалась работа"
      L4: "Слежу, что память реально помогает, и чищу лишнее, когда её накапливается слишком много"
      L5: "Память поддерживает себя сама: устаревшее убирается, а что повторяется — превращается в правило"
    actions:
      to_L3: "Заведи файл памяти агента с двумя разделами: что у меня есть и где · как я люблю работать"

  - id: context_seed
    cluster: context
    title: "Вводные под задачу"
    inspect:
      - "global instructions (что агент получает при старте: кто я, как работать)"
      - "корневой контекст-манифест / роутер, питающий значимые задачи"
    ask: "Когда вы даёте агенту конкретную задачу — он получает все нужные материалы и вводные заранее, или вы каждый раз вспоминаете и докидываете их по ходу?"
    levels:
      L1: "Запускаю задачу как есть — а нужные материалы вспоминаю и докидываю уже по ходу"
      L2: "Иногда готовлю вводные заранее, но без единого порядка — как придётся"
      L3: "На важные задачи есть понятный порядок: что собрать и откуда, прежде чем запускать — и я ему следую"
      L4: "Замечаю, когда задача пошла без полных вводных и её пришлось переделывать — и поправляю свой порядок"
      L5: "Порядок сам подстраивается: где вводных слишком много — упрощаю, где растут переделки — добавляю"
    actions:
      to_L3: "Опиши в файле-памятке: кто я, как работать, чего не делать"

  - id: naming
    cluster: files
    title: "Правило имён файлов"
    inspect:
      - "единый паттерн имён файлов (дата + тип + проект)"
      - "механизм enforcement (проверка/хук, отклоняющий неконформные имена)"
    ask: "Файлы названы по единому правилу — так, что и вы, и агент легко находите нужное? И агент сам так называет новые?"
    levels:
      L1: "Называю как придётся — потом трудно найти и разложить по порядку"
      L2: "Стараюсь придерживаться формата, но непоследовательно и никто не проверяет"
      L3: "Есть единое правило (дата + тип + проект), и все новые файлы называются по нему"
      L4: "Правило проверяется автоматически: имена «не по формату» не проходят, а старые в очереди на переименование"
      L5: "Правило само развивается: новые типы файлов добавляются по реальной надобности, проверка обновляется и ничего не ломает"
    actions:
      to_L3: "Заведи единое правило имён файлов ({проект} {тип} описание — дата) и пропиши его в файл-памятку"

  - id: root_file
    cluster: files
    title: "Файл-памятка для агента"
    inspect:
      - "корневой файл (CLAUDE.md / AGENTS.md) как роутер: куда что класть, где искать"
      - "слои контекста (global → workspace → проект) и guardrails «от обратного»"
    ask: "Есть файл-памятка для агента — где написано, куда что складывать и где что искать, чтобы он не блуждал?"
    levels:
      L1: "Такой памятки нет (или это беспорядочная куча правил) — агент не знает, куда идти за чем"
      L2: "Памятка есть, но это инструкции вперемешку, а не понятный указатель — одно и то же повторяется в разных местах"
      L3: "Памятка работает как указатель: «создаёшь файл — сюда, запускаешь проект — туда», с понятными разделами и правилами «чего не делать»"
      L4: "Замечаю, когда агент полез не туда или не нашёл нужное — и поправляю памятку"
      L5: "Памятка поддерживает себя сама: новое правило сразу попадает в нужный раздел, а устаревшие ссылки вычищаются"
    actions:
      to_L3: "Создай файл-памятку для агента: куда что класть, где искать, чего не делать"

  - id: git
    cluster: files
    title: "Сохранность и история изменений"
    inspect:
      - "git-репозиторий с историей изменений всей системы"
      - "авто-бэкап по расписанию; правило 3-2-1 (3 копии, 2 носителя, 1 вне площадки)"
    ask: "Если завтра компьютер сломается или важный файл случайно удалится — вы его потеряете, или он точно сохранён где-то ещё?"
    levels:
      L1: "Скорее потеряю — всё лежит только на компьютере, отдельно ничего не сохраняется"
      L2: "Иногда вручную копирую важное (на флешку, в облако, шлю себе на почту), но без системы — что-нибудь да пропадёт"
      L3: "Терять нечего: всё важное само сохраняется отдельно от компьютера (например, в облаке), причём сохраняются и прошлые версии — можно открыть файл таким, каким он был вчера или неделю назад"
      L4: "Иногда проверяю, что сохранённое реально на месте и из него получится всё восстановить — где пробел, закрываю"
      L5: "Всё под автоматическим присмотром: система сама проверяет сохранность и заранее предупреждает, если что-то важное не попало в надёжное хранилище"
    actions:
      to_L3: "Настрой автоматическую историю изменений + копию отдельно от компьютера"

  - id: source_map
    cluster: files
    title: "Что где лежит и что конфиденциально"
    inspect:
      - "реестр источников контекста: что где лежит"
      - "уровень доступа / чувствительности по каждому источнику (вкл. изоляцию между клиентами)"
    ask: "Где лежат ваши рабочие материалы и что из них конфиденциальное — это где-то записано или только в голове?"
    levels:
      L1: "Всё держу в голове — отдельного списка, где что лежит и что конфиденциально, нет"
      L2: "Часть мест помню или записал, но не всё, и без пометок, что из этого конфиденциально"
      L3: "Есть список: где какие материалы лежат и насколько они конфиденциальные — и я сверяюсь с ним, прежде чем дать агенту к чему-то доступ"
      L4: "Время от времени проверяю, что список полный и ничего конфиденциального не ушло куда не надо — пробелы закрываю"
      L5: "Список ведёт себя сам: новое место с данными нельзя пускать в работу, пока не помечено, насколько оно конфиденциальное, а нарушения блокируются"
    actions:
      to_L3: "Составь список: где что лежит и что из этого конфиденциально"

  - id: connectors
    cluster: files
    title: "Подключение сервисов"
    inspect:
      - "подключённые коннекторы к ключевым системам (почта, календарь, мессенджеры)"
      - "реестр интеграций + протокол discovery перед запросом доступа"
    ask: "Ваш агент может сам заглянуть в почту, календарь, мессенджеры — или работает только с тем, что вы ему вручную скопируете?"
    levels:
      L1: "Доступа к моей почте/календарю у агента нет — что нужно, копирую и вставляю руками"
      L2: "Кое-что подключил (например, почту), но набор случайный — что-то есть, что-то нет, общего списка нет"
      L3: "Главные системы (почта, календарь, при желании мессенджеры) подключены к агенту, и у меня есть понятный список, что к чему подключено"
      L4: "Слежу, все ли нужные системы подключены и всё ли работает — где пробел или сбой, чиню"
      L5: "Подключения расширяются сами: если я часто лезу куда-то через браузер — это подсказывает подключить, а лишнее отключается"
    actions:
      to_L3: "Подключи почту и календарь к агенту"

  - id: capture
    cluster: capture
    title: "Разбор входящих"
    inspect:
      - "автоматический ингест источников (почта, мессенджеры, транскрипты) в inbox"
      - "воронка inbox → сортировка в действие или знание"
    ask: "Ничего важное из переписки и встреч у вас не теряется — оно само попадает в задачи и заметки? Или приходится вручную следить, чтобы не забыть?"
    levels:
      L1: "Слежу за всем вручную и в голове — что-то забывается и теряется"
      L2: "Часть сохраняется сама, но без порядка — всё равно приходится перепроверять, чтобы не упустить"
      L3: "Важное из писем, сообщений и встреч само превращается в задачи (чтобы не забыть) и заметки (чтобы потом найти) — ничего не теряется"
      L4: "Слежу, что дошло до задач и заметок, а что упустил — и налаживаю разбор"
      L5: "Разбор улучшается сам: новый постоянный источник подхватывается автоматически, а лишнее (спам, шум) отсекается"
    actions:
      to_L3: "Настрой, чтобы письма, сообщения и транскрипты сами собирались и разбирались в задачи и заметки"

  - id: graph
    cluster: capture
    title: "База контактов"
    inspect:
      - "реестры организаций / людей / проектов как карточки"
      - "связи между сущностями (организация ← люди, проекты) и единый источник правды на сущность"
    ask: "Агент знает людей, организации и проекты, с которыми вы работаете, и как они связаны — так, что стоит упомянуть человека или проект, а он уже понимает, о ком или о чём речь? Или всё держится у вас в голове?"
    levels:
      L1: "Кто есть кто и как связано — всё у меня в голове, отдельных записей нет"
      L2: "Что-то записано по отдельности, но без единых карточек и без связей между ними"
      L3: "На каждую организацию, человека и проект есть карточка, они связаны между собой (человек — из организации, проект — с людьми), и по каждому одна главная запись"
      L4: "Слежу, что карточки полные и свежие, а одно и то же не заведено дважды — и поправляю"
      L5: "Всё поддерживается само: если данные о ком-то разошлись по разным местам — это замечается, а дубликаты сливаются в одну карточку"
    actions:
      to_L3: "Заведи базу контактов: карточки организаций, людей и проектов со связями"

  - id: doc_source
    cluster: work
    title: "Работа с документом"
    inspect:
      - "место для входящих документов (папка, стор) и следы разбора"
      - "ответы по документу со ссылкой на страницу или раздел"
    ask: "Когда прилетает большой документ — материалы к совету, финотчёт, договор — вы читаете его сами от корки до корки, или агент разбирает его и отвечает на ваши вопросы, показывая, откуда взял?"
    levels:
      L1: "Читаю сам — к моим документам агент не подключён"
      L2: "Иногда копирую куски в чат, но целиком документ агент не видит"
      L3: "Отдаю документ целиком: агент находит нужное и показывает, на какой странице это написано"
      L4: "Замечаю, где агент промахнулся по документу, и поправляю порядок работы с ним"
      L5: "Под каждый тип свой разбор: у отчёта, договора и резюме он разный и уточняется по опыту"
    actions:
      to_L3: "Заведи место для входящих документов и правило: агент отвечает по ним со ссылкой на страницу"

  - id: playbook
    cluster: work
    title: "Свой порядок под повторяющуюся задачу"
    inspect:
      - "записанные порядки под конкретные задачи (подготовка, разбор, ответ)"
      - "повторное использование одного и того же порядка между заходами"
    ask: "Задачи, которые повторяются — подготовка к совету, разбор отчёта, ответ на типовой запрос — вы каждый раз объясняете заново, или у вас записан порядок, по которому агент делает это одинаково?"
    levels:
      L1: "Каждый раз объясняю заново"
      L2: "Переиспользую удачные запросы, но без системы — где-то в заметках"
      L3: "На повторяющиеся задачи записан порядок: что собрать, что сделать, в каком виде отдать — и агент ему следует"
      L4: "Вижу, где порядок дал сбой, и правлю его"
      L5: "Порядок улучшается сам: удачное закрепляется, лишние шаги отмирают"
    actions:
      to_L3: "Запиши порядок для одной повторяющейся задачи: что собрать, что сделать, в каком виде отдать"

  - id: quality
    cluster: work
    title: "Проверяемость результата"
    inspect:
      - "правило про источники в инструкциях агенту"
      - "критерии приёмки: что считается хорошим результатом"
    ask: "Когда агент выдаёт цифру, вывод или список — вы можете проверить, откуда это взялось, и знаете заранее, что считается хорошим результатом?"
    levels:
      L1: "Беру на веру или перепроверяю всё вручную"
      L2: "Иногда прошу показать источник, но правила нет"
      L3: "Каждая цифра и вывод идут со ссылкой на источник, и я заранее сказал, что для меня хороший результат"
      L4: "Слежу, где выдача разошлась с реальностью, и правлю требования"
      L5: "Проверка встроена: сомнительное помечается само, а повторяющиеся ошибки становятся правилом"
    actions:
      to_L3: "Задай правило: любая цифра и вывод — со ссылкой на источник; опиши, что считаешь хорошим результатом"

  - id: output_form
    cluster: work
    title: "Форма результата"
    inspect:
      - "описанные форматы выдачи под типы задач"
      - "шаблоны выходных документов"
    ask: "Результат приходит в том виде, в котором вы им пользуетесь — письмо готово к отправке, документ к рассылке, — или его каждый раз надо переупаковывать?"
    levels:
      L1: "Получаю текст в чате и переделываю руками"
      L2: "Иногда прошу нужный формат, но каждый раз объясняю заново"
      L3: "Для каждого типа результата описано, в каком виде он нужен, и он приходит готовым"
      L4: "Замечаю, где форма не подошла, и правлю описание"
      L5: "Формы живут сами: новый тип добавляется по надобности, ненужное уходит"
    actions:
      to_L3: "Опиши, в каком виде тебе нужен результат для двух-трёх типовых задач"

  - id: research
    cluster: knowledge
    title: "Внешний поиск с источниками"
    inspect:
      - "подключённый агенту поиск во внешних источниках"
      - "место, где накапливаются собранные обзоры"
    ask: "Когда нужна картина по рынку, компании или человеку — агент ищет сам и показывает, откуда взял, или вы ищете руками в браузере?"
    levels:
      L1: "Ищу сам в браузере — агент во внешний мир не ходит"
      L2: "Агент что-то находит, но без источников, и проверять приходится заново"
      L3: "Агент ищет сам, и у каждого утверждения видна ссылка на источник"
      L4: "Проверяю качество источников и отсекаю ненадёжные"
      L5: "Найденное накапливается: следующий обзор строится поверх прошлого, а не с нуля"
    actions:
      to_L3: "Подключи агенту поиск и задай правило: каждое утверждение со ссылкой на источник"

  - id: decision_log
    cluster: knowledge
    title: "Журнал решений и целей"
    inspect:
      - "файл целей и принятых решений с датами"
      - "отметка, когда к решению вернуться"
    ask: "Ваши цели и принятые решения где-то живут так, что через квартал видно, что вы решили и почему?"
    levels:
      L1: "Решения и цели держатся в голове и в переписке"
      L2: "Что-то записано, но разрозненно — почему решили именно так, потом не восстановить"
      L3: "Есть журнал: что решил, почему, когда вернуться. Цели записаны, и я с ними сверяюсь"
      L4: "Возвращаюсь к решениям в срок и вижу, какие не сработали"
      L5: "Журнал работает сам: подходит срок пересмотра — мне напоминают, а повторяющиеся ошибки становятся правилом"
    actions:
      to_L3: "Заведи журнал решений: что решил, почему, когда пересмотреть"

  - id: handover
    cluster: files
    title: "Работа не в одиночку"
    inspect:
      - "описание, что открыто помощнику, а что закрыто"
      - "правила работы для второго человека в системе"
    ask: "Ваш ассистент или коллега может работать в вашей системе — знает, куда что класть и где искать, и при этом не видит того, что ему не положено?"
    levels:
      L1: "Система только моя, никто в неё не заходит"
      L2: "Пускаю по случаю и объясняю на словах — каждый раз заново"
      L3: "Записано, что открыто помощнику, а что нет, и по каким правилам он работает"
      L4: "Смотрю, где помощник спотыкается или лезет не туда, и поправляю правила"
      L5: "Ввод нового человека занимает часы: правила и доступы готовы, лишнее закрыто само"
    actions:
      to_L3: "Опиши, что открыто помощнику, а что нет, и по каким правилам он работает"

  - id: autonomy
    cluster: work
    title: "Самостоятельность агента"
    inspect:
      - "артефакты, доведённые агентом до готового файла или письма, а не только переписка в чате"
      - "запуск без человека: расписание, фоновые прогоны, следы регулярных запусков"
    ask: "Вы ведёте агента шаг за шагом — спросили, он ответил, следующий шаг подсказали, — или ставите задачу и получаете готовый результат? А что-то он начинает и вовсе сам, без вашей просьбы?"
    levels:
      L1: "Веду за руку: спросил — ответил, следующий шаг подсказываю сам"
      L2: "Иногда проходит два-три шага подряд, но где остановится — не угадать, приходится подталкивать"
      L3: "Ставлю задачу — получаю готовый результат: агент сам проходит цепочку до конца и приносит файл или письмо, а не совет, как это сделать"
      L4: "Вижу, на каком шаге цепочка обрывается или уходит не туда, и правлю: что отдать целиком, а где поставить проверку"
      L5: "Часть работы идёт без моей просьбы: повторяющееся запускается по расписанию или по событию, а мне приходит готовое"
    actions:
      to_L3: "Возьми одну задачу и доведи её с агентом до готового файла — без подсказки на каждом шаге"

  - id: sign_off
    cluster: knowledge
    title: "Граница ответственности"
    inspect:
      - "записанное правило: что агент делает сам, а что уходит только с подтверждением человека (корневой файл / инструкции)"
      - "следы остановки перед необратимым: черновики на визу вместо уже отправленного, подтверждения в журнале"
    ask: "Понятно ли заранее, где кончается агент и начинается ваша подпись: что он делает и отправляет сам, а что не уходит никуда без вашей визы? Или это решается каждый раз по ходу?"
    levels:
      L1: "Такой границы нет: важное делаю сам, а что доверить агенту — решаю каждый раз на ходу"
      L2: "Примерно понимаю, что доверяю, а что нет, но нигде это не записано — и в похожих случаях выходит по-разному"
      L3: "Записано, что агент делает и отправляет сам, а что уходит только с моей визой, — и он сам останавливается на этой черте и приносит на подпись"
      L4: "Замечаю, где агент перешагнул черту или, наоборот, зря остановился и ждал меня, — и правлю правило"
      L5: "Граница двигается сама: что проверено практикой, переходит агенту, а новое и рискованное поднимается ко мне без напоминаний"
    actions:
      to_L3: "Запиши границу: что агент делает и отправляет сам, а что приносит тебе на визу"
