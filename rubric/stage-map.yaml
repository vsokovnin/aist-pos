# headline-стадия (гибрид): мотивирующий заголовок по среднему + честный флаг слабого звена.
# cluster_avg = mean(cap levels в кластере).
# headline_score = mean(cluster_avg по всем кластерам); headline_stage = round(headline_score) (к ближайшему,
# ровно посередине — вниз: заголовок не завышает то, что человек ещё не собрал).
# weak_link = кластер с минимальным cluster_avg — показывается отдельной строкой «слабое звено», НЕ занижает заголовок.
stage_rule: "round(mean(cluster_avg)), половина — вниз"
weak_link_rule: "argmin(cluster_avg)"
# Заголовок стадии человек видит первой строкой выдачи, и на короткой оценке первую-вторую
# стадию собирает большинство. Прежнее имя первой стадии читалось как приговор, а не как
# начало пути — для аудитории руководителей это стоп-сигнал. Имена и описания переписаны
# под пользовательский слой: полными фразами, без латиницы, слешей и обрывков.
stages:
  1: {name: "Первые опыты",  desc: "ИИ помогает разово, в отдельных чатах — из этого ничего не остаётся"}
  2: {name: "Помощник",      desc: "агент помогает по задачам, но плохо помнит вас и не видит ваших материалов"}
  3: {name: "Оператор",      desc: "агент работает в вашем контексте и делает похожие задачи одинаково"}
  4: {name: "Дирижёр",       desc: "повторяющееся идёт без вашей просьбы, а сбои видны и правятся"}
  5: {name: "Архитектор",    desc: "система поддерживает себя сама: нужное закрепляется, лишнее отмирает"}
